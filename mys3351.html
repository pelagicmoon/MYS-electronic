  		<h1>Manyōshū, Poem 3351 (Book 14)</h1>
  		<p>
			筑波根に　雪かも降らる　否をかも　かなしき児ろが　布乾さるかも
		</p>
		
		<p>
			Tsukuba peak,  / the snow, falling?  / or maybe not?  /
			My dear, are you out there,  / leaving fabric to dry?
		</p>
